config:
  target: http://127.0.0.1:18880
  phases:
    - duration: 30
      arrivalRate: 1
      maxVusers: 100
  http:
    timeout: 3
    pool: 16
  plugins:
    expect:
      reportFailuresAsErrors: true
      formatter: prettyError

scenarios:
  - name: Greeting
    weight: 4
    flow:
      - get:
          url: /
          followRedirect: false
          expect:
            - statusCode: 200
            - matchesRegexp: '^Hello from Hono on Wasmer Edge$'
  - name: JSON echo
    weight: 1
    flow:
      - post:
          url: /echo
          followRedirect: false
          json:
            message: artillery-hono
          expect:
            - statusCode: 200
            - jmespath: "message == 'artillery-hono'"
